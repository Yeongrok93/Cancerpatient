name: Supabase Keep-Alive

on:
  schedule:
    - cron: "0 1 * * *"    # 매일 오전 10시 (KST = UTC+9, so UTC 01:00)
    - cron: "0 13 * * *"   # 매일 오후 10시 (KST = UTC+9, so UTC 13:00) — 이중 안전장치
  workflow_dispatch:        # 수동 실행 버튼도 활성화

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write heartbeat row to Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keep_alive" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{\"id\": 1, \"pinged_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}")
          echo "Supabase write response: $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ] && [ "$STATUS" != "204" ]; then
            echo "Warning: unexpected status $STATUS"
            exit 1
          fi
